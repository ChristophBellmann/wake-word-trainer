[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wake-word-trainer"
version = "0.2.0"
description = "Train a microWakeWord model for ESPHome from your own recordings (Wake Word Collector) plus synthetic speech"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pyyaml",
    "scipy",
]

[project.optional-dependencies]
# Feature generation, training and evaluation (TensorFlow, ~3 GB).
train = [
    # Upstream microWakeWord 4665173 plus: __init__.py for microwakeword.audio and
    # .layers (a normal install leaves them out), NumPy 1.26 compatibility and two
    # ROCm/TensorFlow 2.20 export fixes. Branch trainer-compat of the fork.
    "microwakeword @ git+https://github.com/ChristophBellmann/micro-wake-word@664a767db4474cd149d2d54038ab9144808951ef",
    # Used by microWakeWord's training loop but not declared there.
    "tensorboard",
]
# Synthetic speech with Piper ONNX voices (CPU; independent of the training GPU).
tts = [
    "piper-tts>=1.3,<2",
]
# faster-whisper still uses av.open(metadata_errors=...), removed in PyAV 19.
segment = ["faster-whisper>=1.1,<2", "av>=11,<19"]
dev = ["pytest", "ruff"]

[project.scripts]
wake-word-trainer = "wake_word_trainer.cli:main"

[project.urls]
Homepage = "https://github.com/ChristophBellmann/wake-word-trainer"
Issues = "https://github.com/ChristophBellmann/wake-word-trainer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the train extra (TensorFlow); trains a tiny model"]
