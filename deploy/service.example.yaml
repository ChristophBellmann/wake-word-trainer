# wake-word-trainer serve --config service.yaml
project: ~/wakeword/hey_jarvis              # project folder with wakeword.yaml
downloads: ~/wakeword/downloads             # optional: shared downloads
token_file: ~/.config/wake-word-trainer/service.token   # >= 16 characters
bind: 0.0.0.0
port: 10701
# Optional: free VRAM during runs; restart only services that were active before.
# pause_services: [llama-server.service, orpheus-llm.service, wyoming-orpheus.service]
# Optional: refuse to start without free memory (and VRAM); warn while a run swaps.
# resource_check: {min_available_memory_gb: 6, max_load_per_cpu: 0.75, min_free_vram_gb: 8}
profiles:                                   # what Home Assistant can start
  quick: {label: Quick, rounds: 0, steps: 10000}
  recommended: {label: Recommended, rounds: 2}
  thorough: {label: Thorough, rounds: 4, steps: 40000}
  validate: {label: Check data only, prepare_only: true}
speaker_test:                               # optional: play held-out recordings
  routes:
    speakers: [paplay, "{file}"]
    usb: [aplay, -D, "plughw:2,0", "{file}"]

# Optional automatic clip extraction for the Collector; install the segment extra.
# Independent CPU speech recognition; no training GPU or wake-word model required.
extraction:
  enabled: true
  model: small                 # multilingual Whisper model, or local model folder
  cpu_threads: 4
  padding_ms: 200               # context before/after the phrase, clipped at other speech
  min_probability: 0.35
  silence_ms: 500               # separate repeated phrases at these speech pauses
